name: Build Windows CUDA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup CMake
        uses: lukka/get-cmake@v4

      - name: Setup CUDA 13.4
        uses: Jimver/cuda-toolkit@v0.2
        with:
          cuda: '13.4.1'

      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== CMake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== NVCC ==="
          nvcc --version

          Write-Host ""
          Write-Host "=== MSVC ==="
          cl

          Write-Host ""
          Write-Host "=== CUDA_PATH ==="
          Write-Host $env:CUDA_PATH

          if (!$env:CUDA_PATH) {
            throw "CUDA_PATH is not set."
          }

          if (!(Test-Path $env:CUDA_PATH)) {
            throw "CUDA_PATH does not exist: $env:CUDA_PATH"
          }

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DGGML_CUDA=ON `
            -DGGML_CUDA_FA_QUANTS=all `
            -DCMAKE_CUDA_ARCHITECTURES=120 `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --target llama-server `
            --parallel

      - name: Verify binaries
        shell: pwsh
        run: |
          $bin = "build\bin\Release"

          $server = Join-Path $bin "llama-server.exe"

          if (!(Test-Path $server)) {
            throw "llama-server.exe was not generated."
          }

          Write-Host "Found:"
          Get-ChildItem $bin

          Write-Host ""
          Write-Host "=== llama-server --version ==="
          & $server --version

      - name: Verify Adaptive-KV and MTP
        shell: pwsh
        run: |
          $server = "build\bin\Release\llama-server.exe"
          $help = "help.txt"

          & $server --help 2>&1 | Out-File $help -Encoding utf8

          $required = @(
            "--kv-stream-arena-mib",
            "--kv-stream-auxiliary-layers",
            "--spec-type",
            "--spec-draft-n-max"
          )

          foreach ($item in $required) {
            if (!(Select-String -Path $help -Pattern ([regex]::Escape($item)) -Quiet)) {
              throw "Missing required parameter: $item"
            }

            Write-Host "Verified: $item"
          }

          Write-Host ""
          Write-Host "Adaptive-KV / MTP parameters verified."

      - name: Collect CUDA runtime DLLs
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"
          $cudaBin = Join-Path $env:CUDA_PATH "bin"

          if (!(Test-Path $cudaBin)) {
            throw "CUDA bin directory not found: $cudaBin"
          }

          Write-Host "CUDA bin: $cudaBin"

          $runtimePatterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "nvrtc64_*.dll",
            "nvrtc-builtins64_*.dll",
            "nvJitLink_*.dll"
          )

          foreach ($pattern in $runtimePatterns) {
            $files = Get-ChildItem `
              -Path $cudaBin `
              -Filter $pattern `
              -File `
              -ErrorAction SilentlyContinue

            foreach ($file in $files) {
              Write-Host "Copy CUDA runtime: $($file.Name)"
              Copy-Item `
                -Path $file.FullName `
                -Destination $package `
                -Force
            }
          }

      - name: Package
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"
          $bin = "build\bin\Release"

          Remove-Item $package -Recurse -Force -ErrorAction SilentlyContinue
          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package | Out-Null

          # llama-server
          Copy-Item `
            "$bin\llama-server.exe" `
            "$package\"

          # llama-cli, if generated
          if (Test-Path "$bin\llama-cli.exe") {
            Copy-Item `
              "$bin\llama-cli.exe" `
              "$package\"
          }

          # All DLLs generated by the fork
          Get-ChildItem `
            "$bin\*.dll" `
            -File |
            Copy-Item `
              -Destination $package `
              -Force

          # CUDA runtime DLLs
          $cudaBin = Join-Path $env:CUDA_PATH "bin"

          $runtimePatterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "nvrtc64_*.dll",
            "nvrtc-builtins64_*.dll",
            "nvJitLink_*.dll"
          )

          foreach ($pattern in $runtimePatterns) {
            Get-ChildItem `
              -Path $cudaBin `
              -Filter $pattern `
              -File `
              -ErrorAction SilentlyContinue |
              Copy-Item `
                -Destination $package `
                -Force
          }

          # README
          if (Test-Path README.md) {
            Copy-Item README.md "$package\"
          }

          Write-Host ""
          Write-Host "=== Package contents ==="

          Get-ChildItem $package |
            Sort-Object Name |
            Select-Object Name, Length

      - name: Verify package
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"

          $required = @(
            "llama-server.exe",
            "ggml.dll",
            "ggml-cuda.dll"
          )

          foreach ($file in $required) {
            $path = Join-Path $package $file

            if (!(Test-Path $path)) {
              throw "Required package file missing: $file"
            }

            Write-Host "Verified: $file"
          }

          $cudaDlls = Get-ChildItem `
            "$package\*.dll" |
            Where-Object {
              $_.Name -match "^(cudart|cublas|cublasLt|nvrtc|nvrtc-builtins|nvJitLink)"
            }

          if ($cudaDlls.Count -eq 0) {
            throw "No CUDA runtime DLLs were packaged."
          }

          Write-Host ""
          Write-Host "CUDA runtime DLLs:"
          $cudaDlls | Select-Object Name

      - name: Create ZIP
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"
          $zip = "$package.zip"

          Remove-Item $zip -Force -ErrorAction SilentlyContinue

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath $zip `
            -Force

          Write-Host ""
          Write-Host "Created:"
          Get-Item $zip |
            Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: llama-adaptive-kv-windows-cuda
          path: llama-adaptive-kv-windows-cuda.zip
          if-no-files-found: error