name: Build Adaptive-KV Windows CUDA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v7

      - name: Checkout Adaptive-KV source
        uses: actions/checkout@v7
        with:
          repository: troed/llama.cpp-adaptive-kv-streaming
          ref: feature/adaptive-kv-stream-v2-sync
          path: source
          submodules: recursive
          fetch-depth: 0

      - name: Install CUDA Toolkit
        uses: ./source/.github/actions/windows-setup-cuda
        with:
          cuda_version: '13.4'
          cuda_arch: 'x64'

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Check environment
        shell: pwsh
        run: |
          Write-Host "=== Windows ==="
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion

          Write-Host ""
          Write-Host "=== CMake ==="
          cmake --version

          Write-Host ""
          Write-Host "=== Ninja ==="
          ninja --version

          Write-Host ""
          Write-Host "=== NVCC ==="
          nvcc --version

          Write-Host ""
          Write-Host "=== CUDA_PATH ==="
          Write-Host $env:CUDA_PATH

          if (!$env:CUDA_PATH) {
            throw "CUDA_PATH is not set."
          }

          if (!(Test-Path $env:CUDA_PATH)) {
            throw "CUDA_PATH does not exist: $env:CUDA_PATH"
          }

          Write-Host ""
          Write-Host "=== Source commit ==="
          git -C source rev-parse HEAD

          Write-Host ""
          Write-Host "=== Source branch ==="
          git -C source branch --show-current

      - name: Build llama-server
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64

          cmake -S source -B build -G "Ninja Multi-Config" ^
            -DGGML_BACKEND_DL=ON ^
            -DGGML_NATIVE=OFF ^
            -DGGML_CUDA=ON ^
            -DGGML_CUDA_FA_QUANTS=all ^
            -DCMAKE_CUDA_ARCHITECTURES=120 ^
            -DLLAMA_BUILD_BORINGSSL=ON

          cmake --build build ^
            --config Release ^
            --target llama-server ^
            --parallel

      - name: Verify llama-server
        shell: pwsh
        run: |
          $server = "build\bin\Release\llama-server.exe"

          if (!(Test-Path $server)) {
            throw "llama-server.exe was not generated."
          }

          Write-Host "=== llama-server ==="
          Get-Item $server

          Write-Host ""
          Write-Host "=== Version ==="
          & $server --version

      - name: Verify Adaptive-KV and MTP
        shell: pwsh
        run: |
          $server = "build\bin\Release\llama-server.exe"
          $help = "help.txt"

          & $server --help 2>&1 |
            Out-File $help -Encoding utf8

          $required = @(
            "--kv-stream-arena-mib",
            "--kv-stream-auxiliary-layers",
            "--spec-type",
            "--spec-draft-n-max"
          )

          foreach ($item in $required) {
            if (!(Select-String `
                -Path $help `
                -Pattern ([regex]::Escape($item)) `
                -Quiet)) {

              throw "Missing parameter: $item"
            }

            Write-Host "Verified: $item"
          }

          Write-Host ""
          Write-Host "Adaptive-KV / MTP parameters verified."

      - name: Prepare package
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"

          Remove-Item `
            $package `
            -Recurse `
            -Force `
            -ErrorAction SilentlyContinue

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $package |
            Out-Null

      - name: Copy binaries
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"
          $bin = "build\bin\Release"

          Copy-Item `
            "$bin\llama-server.exe" `
            "$package\"

          # ggml.dll / ggml-cuda.dll / other backend DLLs
          Get-ChildItem `
            "$bin\*.dll" `
            -File |
            Copy-Item `
              -Destination $package `
              -Force

      - name: Copy CUDA runtime
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"
          $cudaBin = Join-Path $env:CUDA_PATH "bin"

          if (!(Test-Path $cudaBin)) {
            throw "CUDA bin directory not found: $cudaBin"
          }

          Write-Host "CUDA bin:"
          Write-Host $cudaBin

          $runtimePatterns = @(
            "cudart64_*.dll",
            "cublas64_*.dll",
            "cublasLt64_*.dll",
            "nvrtc64_*.dll",
            "nvrtc-builtins64_*.dll",
            "nvJitLink_*.dll"
          )

          foreach ($pattern in $runtimePatterns) {

            $files = Get-ChildItem `
              -Path $cudaBin `
              -Filter $pattern `
              -File `
              -ErrorAction SilentlyContinue

            foreach ($file in $files) {
              Write-Host "Copy: $($file.Name)"

              Copy-Item `
                $file.FullName `
                $package `
                -Force
            }
          }

      - name: Copy documentation
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"

          if (Test-Path "source\README.md") {
            Copy-Item `
              "source\README.md" `
              "$package\"
          }

      - name: Verify package
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"

          $required = @(
            "llama-server.exe",
            "ggml.dll",
            "ggml-cuda.dll"
          )

          foreach ($file in $required) {

            $path = Join-Path $package $file

            if (!(Test-Path $path)) {
              throw "Required file missing: $file"
            }

            Write-Host "Verified: $file"
          }

          Write-Host ""
          Write-Host "=== CUDA runtime DLLs ==="

          $cudaDlls = Get-ChildItem "$package\*.dll" |
            Where-Object {
              $_.Name -match `
                "^(cudart|cublas|cublasLt|nvrtc|nvrtc-builtins|nvJitLink)"
            }

          if ($cudaDlls.Count -eq 0) {
            throw "No CUDA runtime DLLs found."
          }

          $cudaDlls |
            Sort-Object Name |
            Select-Object Name

          Write-Host ""
          Write-Host "=== Complete package ==="

          Get-ChildItem $package |
            Sort-Object Name |
            Select-Object Name, Length

      - name: Create ZIP
        shell: pwsh
        run: |
          $package = "llama-adaptive-kv-windows-cuda"
          $zip = "$package.zip"

          Remove-Item `
            $zip `
            -Force `
            -ErrorAction SilentlyContinue

          Compress-Archive `
            -Path "$package\*" `
            -DestinationPath $zip `
            -Force

          Write-Host ""
          Write-Host "Created package:"

          Get-Item $zip |
            Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: llama-adaptive-kv-windows-cuda
          path: llama-adaptive-kv-windows-cuda.zip
          if-no-files-found: error